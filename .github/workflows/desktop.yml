name: Desktop (installers)

# Produces the desktop installers for the Tauri shell (DEC-016): Windows .msi
# and NSIS .exe, and Linux .deb, .rpm and AppImage. Kept separate from CI
# because it needs per-OS runners and a Rust toolchain, and because the app
# itself is verified by the ubuntu CI job.
on:
  workflow_dispatch:
  push:
    tags: ['v*']
    # Development branches build installers on demand too, so a Windows build
    # can be produced before this reaches the default branch (workflow_dispatch
    # is only offered for workflows that already live on the default branch).
    #
    # A pattern rather than one branch name: this was pinned to a single branch
    # and silently stopped building the moment work moved to the next one.
    branches: ['claude/**']

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # tauri build runs the client build itself via beforeBuildCommand, but doing
      # it explicitly keeps the failure obvious if the web build is what breaks.
      - name: Build the web client
        run: pnpm build

      - name: Build the Windows installers
        run: pnpm desktop:build

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: ground-up-learning-windows
          if-no-files-found: error
          path: |
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe

  linux-installer:
    # Deliberately 22.04 rather than latest. A Tauri binary links the build
    # host's glibc, and a newer glibc is not available on an older system: a
    # 24.04 build needs GLIBC_2.39 and simply will not start on Linux Mint 21,
    # whose base is 22.04. Building on the older runner runs on both, because
    # glibc is backward compatible in the direction that matters here.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      # WebKitGTK is the webview on Linux, the way WebView2 is on Windows.
      # 4.1 specifically: Tauri v2 dropped 4.0.
      - name: Install Linux webview build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the web client
        run: pnpm build

      - name: Build the Linux packages
        run: pnpm desktop:build

      # A Tauri build that produces a package can still open a blank window -
      # that is exactly what the packaged CSP did on the first Windows build.
      # Launch the real binary on a virtual display and fail if it dies.
      - name: Smoke-test the built binary
        run: |
          sudo apt-get install -y xvfb
          xvfb-run -a --server-args="-screen 0 1280x900x24" \
            ./apps/desktop/src-tauri/target/release/ground-up-learning &
          APP=$!
          sleep 20
          if ! kill -0 $APP 2>/dev/null; then
            echo "The application exited within 20 seconds of launching."
            exit 1
          fi
          kill $APP

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: ground-up-learning-linux
          if-no-files-found: error
          path: |
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/release/bundle/rpm/*.rpm
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
