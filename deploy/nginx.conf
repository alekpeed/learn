# Example static hosting config for the client SPA (doc 15).
# Serves the built apps/client/dist with client-side-routing fallback.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  # Long-cache fingerprinted assets; never cache the entry HTML.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # SPA history fallback: unknown paths return the app shell.
  location / {
    try_files $uri /index.html;
  }
}
