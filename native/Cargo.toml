[workspace]
resolver = "2"
members = [
    "crates/learn-domain",
    "crates/learn-content",
    "crates/learn-validation-engine",
    "crates/learn-diagnostic",
    "crates/learn-learning-engine",
    "crates/learn-persistence",
    "crates/learn-app",
]

[workspace.package]
edition = "2021"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
